<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>A5 Inner-Scroll Test</title>
<style>
  body { overflow: hidden; }
  #outer { width: 600px; height: 400px; overflow-y: scroll; background: #ddd; padding: 10px; }
  #inner-content { height: 1200px; }
  #target { margin-top: 900px; width: 200px; height: 50px; background: #4a9; }
</style>
</head>
<body>
<h1 id="title">A5 Inner-Scroll Test</h1>
<p>Body is overflow:hidden — the REAL scroll container is #outer (inner div), not window. This is the x.com PITFALL 31 case.</p>
<div id="outer">
  <div id="inner-content">
    <p>spacer</p><p>spacer</p><p>spacer</p><p>spacer</p><p>spacer</p>
    <div id="target">TARGET far down the inner scroller</div>
    <p>spacer</p><p>spacer</p><p>spacer</p><p>spacer</p><p>spacer</p>
  </div>
</div>
<pre id="state">ready</pre>
</body>
</html>
