<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { width: 280px; font-family: system-ui; padding: 12px; margin: 0; background: #1a1a1a; color: #e0e0e0; }
h2 { font-size: 14px; margin: 0 0 8px 0; color: #10b981; }
.status { display: flex; align-items: center; gap: 8px; padding: 8px; background: #2a2a2a; border-radius: 6px; margin-bottom: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot.green { background: #10b981; }
.dot.red { background: #ef4444; }
.dot.yellow { background: #f59e0b; }
.info { font-size: 12px; color: #888; margin: 4px 0; }
.url { font-size: 11px; color: #666; word-break: break-all; }
button { width: 100%; padding: 6px; margin-top: 8px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
button:hover { background: #059669; }
</style>
</head>
<body>
<h2>WebSense MCP</h2>
<div class="status">
  <div class="dot yellow" id="dot"></div>
  <span id="status-text">Checking...</span>
</div>
<div class="info" id="url-info"></div>
<div class="info" id="version">v1.0.0</div>
<button id="reconnect">Reconnect</button>
<script src="popup.js"></script>
</body>
</html>
